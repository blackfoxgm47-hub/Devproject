<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ประวัติการประเมิน</title>
    <!-- Google Fonts Prompt -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-header">
            <h2>เมนู</h2>
        </div>
        <ul class="sidebar-menu">
            <li class="menu-item">
                <a href="index.html" class="menu-link" data-icon="🏠"><span>หน้าแรก</span></a>
            </li>
            <li class="menu-item">
                <a href="evaluation.html" class="menu-link" data-icon="📝"><span>แบบประเมินลูกไก่ก่อนออก</span></a>
            </li>
            <li class="menu-item active">
                <a href="history.html" class="menu-link" data-icon="📋"><span>ประวัติการประเมิน</span></a>
            </li>
            <li class="menu-item">
                <a href="dashboard.html" class="menu-link" data-icon="📊"><span>ภาพรวมการประเมิน</span></a>
            </li>
        </ul>
        
        <!-- Desktop Collapse Button -->
        <button class="btn btn-collapse d-none d-lg-block" id="sidebarCollapse">
            <span class="collapse-icon">◀</span>
        </button>
    </div>

    <div class="main-content">
        <!-- Mobile Hamburger Menu -->
        <button class="btn btn-hamburger d-lg-none" id="sidebarToggle">
            <span class="hamburger-icon"></span>
        </button>
        
        <!-- Backdrop Overlay -->
        <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
        
        <div class="container-fluid">
            <h1 class="title">ประวัติการประเมิน</h1>

            <div class="section">
                <div style="display: flex; gap: 10px; margin-bottom: 20px;">
                    <button onclick="loadHistory()" class="btn btn-load">โหลดประวัติ</button>
                    <button onclick="exportToCSV()" class="btn btn-save">Export Excel (CSV)</button>
                    <button onclick="clearHistory()" class="btn btn-clear">ล้างประวัติ</button>
                </div>
            </div>

            <div class="section table-section">
                <table class="data-table" id="historyTable">
                    <thead>
                        <tr>
                            <th>ลำดับที่</th>
                            <th>วันที่</th>
                            <th>เวลา Start prod</th>
                            <th>จำนวนตู้</th>
                            <th>%ตู้ที่ผ่าน</th>
                            <th>เวลาออกลูกไก่</th>
                            <th>การจัดการ</th>
                        </tr>
                    </thead>
                    <tbody id="historyBody">
                        <!-- History rows will be generated by JavaScript -->
                    </tbody>
                </table>
            </div>

            <div id="historyDetails" class="section" style="display: none;">
                <h3 class="section-title">รายละเอียดข้อมูล</h3>
                <div id="detailContent"></div>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="firebase.js"></script>
    <script src="history.js"></script>
    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Sidebar Toggle Functionality
        document.addEventListener('DOMContentLoaded', function() {
            const sidebar = document.querySelector('.sidebar');
            const sidebarToggle = document.getElementById('sidebarToggle');
            const sidebarBackdrop = document.getElementById('sidebarBackdrop');
            const sidebarCollapse = document.getElementById('sidebarCollapse');
            const mainContent = document.querySelector('.main-content');

            // Mobile: Toggle sidebar with hamburger menu
            if (sidebarToggle) {
                sidebarToggle.addEventListener('click', function() {
                    sidebar.classList.toggle('active');
                    sidebarBackdrop.classList.toggle('active');
                    sidebarToggle.classList.toggle('active');
                });
            }

            // Mobile: Close sidebar when clicking backdrop
            if (sidebarBackdrop) {
                sidebarBackdrop.addEventListener('click', function() {
                    sidebar.classList.remove('active');
                    sidebarBackdrop.classList.remove('active');
                    if (sidebarToggle) {
                        sidebarToggle.classList.remove('active');
                    }
                });
            }

            // Desktop: Collapse/Expand sidebar
            if (sidebarCollapse) {
                sidebarCollapse.addEventListener('click', function() {
                    sidebar.classList.toggle('collapsed');
                    mainContent.classList.toggle('sidebar-collapsed');
                });
            }
        });
    </script>
</body>
</html>
